<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Salient</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#090B22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet">
<!-- Styles are inline on purpose: Cloudflare shows this page at any broken URL
     (e.g. /old/page), and it must look right without loading styles.css. -->
<style>
  :root{--navy:#090B22;--royal:#2433DB;--elec:#3E54FF;--soft:#9AA1D6;--d-soft:#B4B8D9;
    --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:#fff;font:400 1rem/1.6 var(--font);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--elec);outline-offset:3px;border-radius:6px}
  .nf{position:relative;overflow:hidden;isolation:isolate;min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;
    padding:48px 0;
    background:radial-gradient(900px 500px at 85% 10%,rgba(36,51,219,.45),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(34,176,38,.12),transparent 60%),var(--navy)}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none}
  .o1{width:420px;height:420px;right:4%;top:6%;background:rgba(62,84,255,.38)}
  .o2{width:300px;height:300px;left:-80px;bottom:-60px;background:rgba(34,176,38,.18)}
  .nf__mark{position:absolute;width:min(46vw,420px);height:auto;right:-6%;bottom:-8%;opacity:.12;z-index:-1;pointer-events:none}
  .wrap{width:min(1180px,100% - 48px);margin-inline:auto}
  .nf__logo{display:inline-block;margin-bottom:44px}
  .nf__logo img{display:block;width:150px;height:auto}
  h1{font-weight:600;font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.05em;line-height:1.02;text-wrap:balance;max-width:15ch;margin:0 auto 18px}
  .h1-soft{display:block;color:var(--soft)}
  p{color:var(--soft);max-width:42ch;margin:0 auto 34px;font-size:1.08rem}
  .nf__cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--royal);color:#fff;text-decoration:none;border:0;cursor:pointer;
    font:600 .98rem var(--font);padding:15px 24px;border-radius:999px;transition:background .25s,transform .25s var(--ease);
    box-shadow:0 10px 30px -10px rgba(62,84,255,.7)}
  .btn:hover{background:var(--elec);transform:translateY(-1px)}
  .btn--ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
  .btn--ghost:hover{background:rgba(255,255,255,.06)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 100 104">
      <path d="M50 0 L50 80 L4 104 Z" fill="#1E9E23"/>
      <path d="M50 0 L96 104 L50 80 Z" fill="#5BD25F"/>
    </symbol>
  </defs>
</svg>
<main class="nf">
  <div class="orb o1" aria-hidden="true"></div><div class="orb o2" aria-hidden="true"></div>
  <svg class="nf__mark" viewBox="0 0 100 104" aria-hidden="true"><use href="#mark"/></svg>
  <div class="wrap">
    <a class="nf__logo" href="/" aria-label="Salient home"><img src="/assets/salient-logo-white.png" alt="Salient" width="640" height="404"
      onerror="this.onerror=null;this.src='assets/salient-logo-white.png'"></a>
    <h1>This page doesn’t exist. <span class="h1-soft">Your pipeline still can.</span></h1>
    <p>The link may be old or mistyped. Everything about Salient is on our home page.</p>
    <div class="nf__cta">
      <a class="btn" href="/">Go to the home page</a>
      <a class="btn btn--ghost" href="/#contact">Book a scoping call</a>
    </div>
  </div>
</main>
</body>
</html>
